<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Monitor</title>
    <!-- A phone paints its own bars over or beside the document, where no stylesheet
         reaches. These together make the header run into the status bar instead of
         stopping under it: the translucent style puts the page under the bar on iOS,
         the two capable metas open this as an app rather than a tab, and theme-color
         is what Chrome tints its bars with. All of them carry the header's --nav, so
         bar and header read as one surface; App.tsx keeps the colour in step with the
         theme, and index.css sets color-scheme so the bar's glyphs flip with it.
         The hub writes the chosen palette's two --nav values onto <html> as
         data-nav-dark and data-nav-light; the fallbacks are the original palette's. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c2127" />
    <script>
      // In head, so the dark page is dark on the first paint. Same rule as useTheme:
      // only a stored preference moves either of these.
      ;(function () {
        var html = document.documentElement, bar = document.querySelector('meta[name="theme-color"]')
        if (localStorage.getItem("theme") === "light") {
          bar.content = html.dataset.navLight || "#f9f9f9"
        } else {
          html.classList.add("dark")
          bar.content = html.dataset.navDark || "#1c2127"
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
