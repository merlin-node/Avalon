# Avalon：hub + Cloudflare Tunnel。hub 不占用服务器任何端口，唯一的入口是 Tunnel。
# 同目录的 .env 里放 TUNNEL_TOKEN=Cloudflare 给的密钥。
services:
  avalon:
    image: ghcr.io/merlin-node/avalon:latest
    container_name: avalon
    restart: unless-stopped
    volumes:
      - avalon-data:/data
    environment:
      TZ: Asia/Shanghai
      AVALON_CF_TUNNEL: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: avalon-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?在 .env 里填 TUNNEL_TOKEN}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - avalon

volumes:
  avalon-data:
