[package]
name = "linux-probe"
version = "0.2.0"
edition = "2021"
# src/bin 下的 admin.rs、ping.rs 是 hub 的模块，不是独立程序。
# 不关掉自动发现，cargo 会把它们各自当成一个二进制去编译，然后报几百个错。
autobins = false
license = "MIT"

[[bin]]
name = "probe-hub"
path = "src/bin/hub.rs"

[[bin]]
name = "probe-agent"
path = "src/bin/agent.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
argon2 = "0.5"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
# 监控表单里的一组复选框会发出同名的多个 nodes 键，serde_urlencoded 装不下。
# 这个 crate 本来就在 url 的依赖树里，不增加实际体积。
form_urlencoded = "1"
# 把访问判定包在整个路由外面要用到 Layer trait。它本来就在 axum 的依赖树里，不增加体积。
tower-layer = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
