# 别人提 Pull Request 时跑一遍测试。推到 main 的测试在 build.yml 里，和构建一起跑。
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test --locked
