# 每次推送都跑一遍测试。和在 VPS 上 cargo test 是同一套，只是换成 GitHub 的机器跑。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test --locked
