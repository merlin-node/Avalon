# 别人提 Pull Request 时跑一遍测试。推到 main 的测试在 build.yml 里，和构建一起跑。
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: theme/package-lock.json
      # 公开页主题从 theme/ 的源码构建，产物不进仓库，hub 编译时把它嵌进去
      - name: 构建主题
        working-directory: theme
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        # 钉成提交号以后它从 @ 后面认不出要装哪个版本，要明写
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 测试
        run: cargo test --locked
