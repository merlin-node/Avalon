# 每次推到 main：跑测试 → 编译 x86_64 和 ARM64 两种静态程序 → 打多架构镜像推到 ghcr.io。
# 镜像标签是 latest 和 sha-提交号前七位。服务器上 docker compose pull 拿到的就是最新代码，
# 服务器本身不用编译。新版有问题时，可以用 sha- 标签退回任意一次提交。
name: build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# 连续推好几次时只构建最后一次，不排长队
concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Cargo.lock
        run: test -f Cargo.lock || { echo "::error::仓库里缺 Cargo.lock，测试和构建都靠它锁定依赖版本"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # cross 在容器里编译，自带目标架构的 C 编译器（SQLite 和加密库都有 C 代码）
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: 编译
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: 整理产物
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/probe-hub dist/probe-hub-linux-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/probe-agent dist/probe-agent-linux-${{ matrix.arch }}
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - run: chmod 755 dist/probe-*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 镜像名必须全小写；sha 标签取提交号前七位
      - name: 镜像名
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.SHORT }}
